# Atari Music Composer — documentation site configuration.
#
# Preview locally:   python -m mkdocs serve
# Strict build:      python -m mkdocs build --strict
# CI deployment:     .github/workflows/docs.yml (official GitHub Pages Actions mechanism)

site_name: Atari Music Composer
site_description: >-
  Python toolchain and relocatable MOS 6502 audio driver for composing,
  validating, arranging, synthesizing, and compiling multi-channel music for
  Atari 8-bit computers with the POKEY sound chip.
site_url: https://grzes71.github.io/atari-music-composer/
repo_url: https://github.com/grzes71/atari-music-composer
repo_name: grzes71/atari-music-composer
edit_uri: edit/main/docs/
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.top
    - navigation.sections
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    # Light mode (follows system preference, user can toggle)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Resolve snippet includes from the repository root first, then docs/.
      base_path: [".", "docs"]
  - pymdownx.superfences:
      custom_fences:
        # Mermaid diagrams are rendered client-side by Material for MkDocs
        # (no extra plugins, no Node.js toolchain required).
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

